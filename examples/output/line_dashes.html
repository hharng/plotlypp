<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Plotly++ Plot</title>
    <script src="./js/plotly.min.js"></script>
    <script>
        if (typeof Plotly === 'undefined') {
            document.write('<script src="./plotly.min.js"><\/script>')
            document.write('<script src="https://cdn.plot.ly/plotly-3.0.1.min.js"><\/script>')
        }
    </script>
</head>
<body>
    <div id="plot"></div>
    <script>
        const plotDiv = document.getElementById('plot');
        const data = JSON.parse('[{"line":{"dash":"solid","width":4.0},"mode":"lines","name":"Solid","type":"scatter","x":[1,2,3,4,5],"y":[1,3,2,3,1]},{"line":{"dash":"dashdot","width":4.0},"mode":"lines","name":"DashDot","type":"scatter","x":[1,2,3,4,5],"y":[6,8,7,8,6]},{"line":{"dash":"solid","width":4.0},"mode":"lines","name":"Solid","type":"scatter","x":[1,2,3,4,5],"y":[11,13,12,13,11]},{"line":{"dash":"dot","width":4.0},"mode":"lines","name":"Dot","type":"scatter","x":[1,2,3,4,5],"y":[16,18,17,18,16]}]');
        const layout = JSON.parse('{"legend":{"font":{"size":16.0},"traceorder":"reversed","y":0.5},"title":{"text":"Line Dash"},"xaxis":{"autorange":false,"range":[0.75,5.25]},"yaxis":{"autorange":false,"range":[0.0,18.5]}}');
        let resizing = false;
        function applyResize() {
            plotDiv.style.width = window.innerWidth + 'px';
            plotDiv.style.height = window.innerHeight + 'px';
            Plotly.newPlot(plotDiv, data, layout);
            resizing = false;
        }
        plotDiv.style.width = window.innerWidth + 'px';
        plotDiv.style.height = window.innerHeight + 'px';
        Plotly.newPlot(plotDiv, data, layout);
        window.addEventListener('resize', () => {
            if (!resizing) {
                resizing = true;
                window.requestAnimationFrame(applyResize);
            }
        });
    </script>
</body>
</html>
