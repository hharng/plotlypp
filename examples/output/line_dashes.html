<meta charset="utf-8">
<head>
    <script src="./js/plotly.min.js"></script>
    <script>
        if (typeof Plotly === 'undefined') {
            document.write('<script src="./plotly.min.js">\x3C/script>')
            document.write('<script src="https://cdn.plot.ly/plotly-3.0.1.min.js">\x3C/script>')
        }
    </script>
</head>
<body>
    <div id="plot"></div>
    <script>
        function resizeDiv() {
            const div = document.getElementById('plot');
            div.style.width = window.innerWidth;
            div.style.height = window.innerHeight;
            data = JSON.parse('[{"line":{"dash":"solid","width":4.0},"mode":"lines","name":"Solid","type":"scatter","x":[1,2,3,4,5],"y":[1,3,2,3,1]},{"line":{"dash":"dashdot","width":4.0},"mode":"lines","name":"DashDot","type":"scatter","x":[1,2,3,4,5],"y":[6,8,7,8,6]},{"line":{"dash":"solid","width":4.0},"mode":"lines","name":"Solid","type":"scatter","x":[1,2,3,4,5],"y":[11,13,12,13,11]},{"line":{"dash":"dot","width":4.0},"mode":"lines","name":"Dot","type":"scatter","x":[1,2,3,4,5],"y":[16,18,17,18,16]}]')
            layout = JSON.parse('{"legend":{"font":{"size":16.0},"traceorder":"reversed","y":0.5},"title":{"text":"Line Dash"},"xaxis":{"autorange":"False","range":[0.75,5.25]},"yaxis":{"autorange":"False","range":[0.0,18.5]}}')
            Plotly.newPlot('plot', data, layout);
        }
        // Call resizeDiv initially to set the size on page load.
        resizeDiv();
        // Add an event listener to the window's resize event.
        window.addEventListener('resize', resizeDiv);
    </script>
</body>
