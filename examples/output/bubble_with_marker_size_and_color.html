<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Plotly++ Plot</title>
    <script src="./js/plotly.min.js"></script>
    <script>
        if (typeof Plotly === 'undefined') {
            document.write('<script src="./plotly.min.js"><\/script>')
            document.write('<script src="https://cdn.plot.ly/plotly-3.0.1.min.js"><\/script>')
        }
    </script>
</head>
<body>
    <div id="plot"></div>
    <script>
        const plotDiv = document.getElementById('plot');
        const data = JSON.parse('[{"marker":{"color":["rgb(93, 164, 214)","rgb(255, 144, 14)","rgb(44, 160, 101)","rgb(255, 65, 54)"],"opacity":[1.0,0.8,0.6,0.4],"size":[40.0,60.0,80.0,100.0]},"mode":"markers","type":"scatter","x":[1,2,3,4],"y":[10,11,12,13]}]');
        const layout = JSON.parse('{"height":600.0,"showlegend":false,"title":{"text":"Marker Size and Color"},"width":600.0}');
        let resizing = false;
        function applyResize() {
            plotDiv.style.width = window.innerWidth + 'px';
            plotDiv.style.height = window.innerHeight + 'px';
            Plotly.newPlot(plotDiv, data, layout);
            resizing = false;
        }
        plotDiv.style.width = window.innerWidth + 'px';
        plotDiv.style.height = window.innerHeight + 'px';
        Plotly.newPlot(plotDiv, data, layout);
        window.addEventListener('resize', () => {
            if (!resizing) {
                resizing = true;
                window.requestAnimationFrame(applyResize);
            }
        });
    </script>
</body>
</html>
