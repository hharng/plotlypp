<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Plotly++ Plot</title>
    <script src="./js/plotly.min.js"></script>
    <script>
        if (typeof Plotly === 'undefined') {
            document.write('<script src="./plotly.min.js"><\/script>')
            document.write('<script src="https://cdn.plot.ly/plotly-3.0.1.min.js"><\/script>')
        }
    </script>
</head>
<body>
    <div id="plot"></div>
    <script>
        const plotDiv = document.getElementById('plot');
        const data = JSON.parse('[{"marker":{"color":"rgb(214,12,140)"},"name":"Sample A","type":"box","y":[1,2,3,4,4,4,8,9,10]},{"marker":{"color":"rgb(0,128,128)"},"name":"Sample B","type":"box","y":[2,3,3,3,3,5,6,6,7]}]');
        const layout = JSON.parse('{"title":{"text":"Colored Box Plot"}}');
        let resizing = false;
        function applyResize() {
            plotDiv.style.width = window.innerWidth + 'px';
            plotDiv.style.height = window.innerHeight + 'px';
            Plotly.newPlot(plotDiv, data, layout);
            resizing = false;
        }
        plotDiv.style.width = window.innerWidth + 'px';
        plotDiv.style.height = window.innerHeight + 'px';
        Plotly.newPlot(plotDiv, data, layout);
        window.addEventListener('resize', () => {
            if (!resizing) {
                resizing = true;
                window.requestAnimationFrame(applyResize);
            }
        });
    </script>
</body>
</html>
