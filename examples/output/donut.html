<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Plotly++ Plot</title>
    <script src="./js/plotly.min.js"></script>
    <script>
        if (typeof Plotly === 'undefined') {
            document.write('<script src="./plotly.min.js"><\/script>')
            document.write('<script src="https://cdn.plot.ly/plotly-3.0.1.min.js"><\/script>')
        }
    </script>
</head>
<body>
    <div id="plot"></div>
    <script>
        const plotDiv = document.getElementById('plot');
        const data = JSON.parse('[{"domain":{"column":0},"hole":0.4,"hoverinfo":"label+percent+name","labels":["US","China","European Union","Russian Federation","Brazil","India","Rest of World"],"name":"GHG Emissions","type":"pie","values":[16,15,12,6,5,4,42]},{"domain":{"column":1},"hole":0.4,"hoverinfo":"label+percent+name","labels":["US","China","European Union","Russian Federation","Brazil","India","Rest of World"],"name":"CO2 Emissions","text":["CO2"],"textposition":"inside","type":"pie","values":[27,11,25,8,1,3,25]}]');
        const layout = JSON.parse('{"annotations":[{"font":{"size":20.0},"showarrow":false,"text":"GHG","x":0.17,"y":0.5},{"font":{"size":20.0},"showarrow":false,"text":"CO2","x":0.82,"y":0.5}],"grid":{"columns":2,"rows":1},"height":400.0,"showlegend":false,"title":{"text":"Global Emissions 1990-2011"},"width":600.0}');
        let resizing = false;
        function applyResize() {
            plotDiv.style.width = window.innerWidth + 'px';
            plotDiv.style.height = window.innerHeight + 'px';
            Plotly.newPlot(plotDiv, data, layout);
            resizing = false;
        }
        plotDiv.style.width = window.innerWidth + 'px';
        plotDiv.style.height = window.innerHeight + 'px';
        Plotly.newPlot(plotDiv, data, layout);
        window.addEventListener('resize', () => {
            if (!resizing) {
                resizing = true;
                window.requestAnimationFrame(applyResize);
            }
        });
    </script>
</body>
</html>
