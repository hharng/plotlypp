<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Plotly++ Plot</title>
    <script src="./js/plotly.min.js"></script>
    <script>
        if (typeof Plotly === 'undefined') {
            document.write('<script src="./plotly.min.js"><\/script>')
            document.write('<script src="https://cdn.plot.ly/plotly-3.0.1.min.js"><\/script>')
        }
    </script>
</head>
<body>
    <div id="plot"></div>
    <script>
        const plotDiv = document.getElementById('plot');
        const data = JSON.parse('[{"colorscale":"Jet","type":"contour","z":[[10.0,10.625,12.5,15.625,20.0],[5.625,6.25,8.125,11.25,15.625],[2.5,3.125,5.0,8.125,12.5],[0.625,1.25,3.125,6.25,10.625],[0.0,0.625,2.5,5.625,10.0]]}]');
        const layout = JSON.parse('{"title":{"text":"Colorscale for Contour Plot"}}');
        let resizing = false;
        function applyResize() {
            plotDiv.style.width = window.innerWidth + 'px';
            plotDiv.style.height = window.innerHeight + 'px';
            Plotly.newPlot(plotDiv, data, layout);
            resizing = false;
        }
        plotDiv.style.width = window.innerWidth + 'px';
        plotDiv.style.height = window.innerHeight + 'px';
        Plotly.newPlot(plotDiv, data, layout);
        window.addEventListener('resize', () => {
            if (!resizing) {
                resizing = true;
                window.requestAnimationFrame(applyResize);
            }
        });
    </script>
</body>
</html>
