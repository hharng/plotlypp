<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Plotly++ Plot</title>
    <script src="./js/plotly.min.js"></script>
    <script>
        if (typeof Plotly === 'undefined') {
            document.write('<script src="./plotly.min.js">\x3C/script>')
            document.write('<script src="https://cdn.plot.ly/plotly-3.0.1.min.js">\x3C/script>')
        }
    </script>
</head>
<body>
    <div id="plot"></div>
    <script>
        function resizeDiv() {
            const div = document.getElementById('plot');
            div.style.width = window.innerWidth;
            div.style.height = window.innerHeight;
            data = JSON.parse('[{"lat":[40.7127,51.5072],"line":{"color":"blue","width":2.0},"lon":[-74.0059,0.1275],"mode":"lines","type":"scattergeo"}]')
            layout = JSON.parse('{"geo":{"coastlinewidth":2.0,"countrycolor":"rgb(204, 204, 204)","lakecolor":"rgb(255, 255, 255)","landcolor":"rgb(204, 204, 204)","lataxis":{"dtick":10.0,"range":[20.0,60.0],"showgrid":true},"lonaxis":{"dtick":20.0,"range":[-100.0,20.0],"showgrid":true},"projection":{"type":"equirectangular"},"resolution":"50","showlakes":true,"showland":true},"showlegend":false,"title":{"text":"London to NYC Great Circle"}}')
            Plotly.newPlot('plot', data, layout);
        }
        // Call resizeDiv initially to set the size on page load.
        resizeDiv();
        // Add an event listener to the window's resize event.
        window.addEventListener('resize', resizeDiv);
    </script>
</body>
</html>
