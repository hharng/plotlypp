<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Plotly++ Plot</title>
    <script src="./js/plotly.min.js"></script>
    <script>
        if (typeof Plotly === 'undefined') {
            document.write('<script src="./plotly.min.js"><\/script>')
            document.write('<script src="https://cdn.plot.ly/plotly-3.0.1.min.js"><\/script>')
        }
    </script>
</head>
<body>
    <div id="plot"></div>
    <script>
        const plotDiv = document.getElementById('plot');
        const data = JSON.parse('[{"colorbar":{"len":0.45,"y":1.0,"yanchor":"top"},"lat":[15,25,35],"lon":[10,20,30],"radius":50.0,"type":"densitymap","z":[1,3,2]},{"colorbar":{"len":0.45,"y":0.0,"yanchor":"bottom"},"lat":[15,25,35],"lon":[-10,-20,-30],"radius":[50.0,100.0,10.0],"type":"densitymap"}]');
        const layout = JSON.parse('{"height":400.0,"map":{"center":{"lat":20.0},"style":"light"},"width":600.0}');
        let resizing = false;
        function applyResize() {
            plotDiv.style.width = window.innerWidth + 'px';
            plotDiv.style.height = window.innerHeight + 'px';
            Plotly.newPlot(plotDiv, data, layout);
            resizing = false;
        }
        plotDiv.style.width = window.innerWidth + 'px';
        plotDiv.style.height = window.innerHeight + 'px';
        Plotly.newPlot(plotDiv, data, layout);
        window.addEventListener('resize', () => {
            if (!resizing) {
                resizing = true;
                window.requestAnimationFrame(applyResize);
            }
        });
    </script>
</body>
</html>
