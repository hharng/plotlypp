<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Plotly++ Plot</title>
    <script src="./js/plotly.min.js"></script>
    <script>
        if (typeof Plotly === 'undefined') {
            document.write('<script src="./plotly.min.js"><\/script>')
            document.write('<script src="https://cdn.plot.ly/plotly-3.0.1.min.js"><\/script>')
        }
    </script>
</head>
<body>
    <div id="plot"></div>
    <script>
        const plotDiv = document.getElementById('plot');
        const data = JSON.parse('[{"marker":{"color":"rgba(156, 165, 196, 0.95)","line":{"color":"rgba(156, 165, 19)","width":1.0},"size":16.0,"symbol":"circle"},"mode":"markers","name":"Percent of estimated voting age population","type":"scatter","x":[40.0,45.7,52.0,53.6,54.1,54.2,54.5,54.7,55.1,56.6],"y":["Switzerland (2011)","Chile (2013)","Japan (2014)","United States (2012)","Slovenia (2014)","Canada (2011)","Poland (2010)","Estonia (2015)","Luxembourg (2013)","Portugal (2011)"]},{"marker":{"color":"rgba(204, 204, 204, 0.95)","line":{"color":"rgba(217, 217, 217, 1.0)","width":1.0},"size":16.0,"symbol":"circle"},"mode":"markers","name":"Percent of estimated registered voters","type":"scatter","x":[49.1,42.0,52.7,84.3,51.7,61.1,55.3,64.2,91.1,58.9],"y":["Switzerland (2011)","Chile (2013)","Japan (2014)","United States (2012)","Slovenia (2014)","Canada (2011)","Poland (2010)","Estonia (2015)","Luxembourg (2013)","Portugal (2011)"]}]');
        const layout = JSON.parse('{"height":600.0,"hovermode":"closest","legend":{"font":{"size":10.0},"xanchor":"right","yanchor":"middle"},"margin":{"b":50.0,"l":140.0,"r":40.0,"t":80.0},"paper_bgcolor":"rgb(254, 247, 234)","plot_bgcolor":"rgb(254, 247, 234)","title":{"font":{"color":"rgb(204, 204, 204)"},"text":"Votes cast for ten lowest voting age population in OECD countries"},"width":600.0,"xaxis":{"dtick":10,"linecolor":"rgb(102, 102, 102)","showgrid":false,"showline":true,"tickcolor":"rgb(102, 102, 102)","tickfont":{"color":"rgb(102, 102, 102)"},"tickmode":"linear","ticks":"outside"}}');
        let resizing = false;
        function applyResize() {
            plotDiv.style.width = window.innerWidth + 'px';
            plotDiv.style.height = window.innerHeight + 'px';
            Plotly.newPlot(plotDiv, data, layout);
            resizing = false;
        }
        plotDiv.style.width = window.innerWidth + 'px';
        plotDiv.style.height = window.innerHeight + 'px';
        Plotly.newPlot(plotDiv, data, layout);
        window.addEventListener('resize', () => {
            if (!resizing) {
                resizing = true;
                window.requestAnimationFrame(applyResize);
            }
        });
    </script>
</body>
</html>
