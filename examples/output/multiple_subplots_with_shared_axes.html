<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Plotly++ Plot</title>
    <script src="./js/plotly.min.js"></script>
    <script>
        if (typeof Plotly === 'undefined') {
            document.write('<script src="./plotly.min.js"><\/script>')
            document.write('<script src="https://cdn.plot.ly/plotly-3.0.1.min.js"><\/script>')
        }
    </script>
</head>
<body>
    <div id="plot"></div>
    <script>
        const plotDiv = document.getElementById('plot');
        const data = JSON.parse('[{"type":"scatter","x":[1,2,3],"y":[2,3,4]},{"type":"scatter","x":[20,30,40],"xaxis":"x2","y":[5,5,5],"yaxis":"y"},{"type":"scatter","x":[2,3,4],"xaxis":"x","y":[600,700,800],"yaxis":"y3"},{"type":"scatter","x":[4000,5000,6000],"xaxis":"x4","y":[7000,8000,9000],"yaxis":"y4"}]');
        const layout = JSON.parse('{"grid":{"columns":2,"roworder":"bottom to top","rows":2,"subplots":[["xy","x2y"],["xy3","x4y4"]]}}');
        let resizing = false;
        function applyResize() {
            plotDiv.style.width = window.innerWidth + 'px';
            plotDiv.style.height = window.innerHeight + 'px';
            Plotly.newPlot(plotDiv, data, layout);
            resizing = false;
        }
        plotDiv.style.width = window.innerWidth + 'px';
        plotDiv.style.height = window.innerHeight + 'px';
        Plotly.newPlot(plotDiv, data, layout);
        window.addEventListener('resize', () => {
            if (!resizing) {
                resizing = true;
                window.requestAnimationFrame(applyResize);
            }
        });
    </script>
</body>
</html>
