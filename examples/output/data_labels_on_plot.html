<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Plotly++ Plot</title>
    <script src="./js/plotly.min.js"></script>
    <script>
        if (typeof Plotly === 'undefined') {
            document.write('<script src="./plotly.min.js"><\/script>')
            document.write('<script src="https://cdn.plot.ly/plotly-3.0.1.min.js"><\/script>')
        }
    </script>
</head>
<body>
    <div id="plot"></div>
    <script>
        const plotDiv = document.getElementById('plot');
        const data = JSON.parse('[{"marker":{"size":12.0},"mode":"markers+text","name":"Team A","text":["A-1","A-2","A-3","A-4","A-5"],"textfont":{"family":"Raleway, sans-serif"},"textposition":"top center","type":"scatter","x":[1,2,3,4,5],"y":[1,6,3,6,1]},{"marker":{"size":12.0},"mode":"markers+text","name":"Team B","text":["B-a","B-b","B-c","B-d","B-e"],"textfont":{"family":"Times New Roman"},"textposition":"bottom center","type":"scatter","x":[1.5,2.5,3.5,4.5,5.5],"y":[4,1,7,1,4]}]');
        const layout = JSON.parse('{"legend":{"font":{"color":"grey","family":"Arial, sans-serif","size":20.0},"y":0.5,"yref":"paper"},"title":{"text":"Data Labels on the Plot"},"xaxis":{"range":[0.75,5.25]},"yaxis":{"range":[0.0,8.0]}}');
        let resizing = false;
        function applyResize() {
            plotDiv.style.width = window.innerWidth + 'px';
            plotDiv.style.height = window.innerHeight + 'px';
            Plotly.newPlot(plotDiv, data, layout);
            resizing = false;
        }
        plotDiv.style.width = window.innerWidth + 'px';
        plotDiv.style.height = window.innerHeight + 'px';
        Plotly.newPlot(plotDiv, data, layout);
        window.addEventListener('resize', () => {
            if (!resizing) {
                resizing = true;
                window.requestAnimationFrame(applyResize);
            }
        });
    </script>
</body>
</html>
