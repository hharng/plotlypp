<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Plotly++ Plot</title>
    <script src="./js/plotly.min.js"></script>
    <script>
        if (typeof Plotly === 'undefined') {
            document.write('<script src="./plotly.min.js"><\/script>')
            document.write('<script src="https://cdn.plot.ly/plotly-3.0.1.min.js"><\/script>')
        }
    </script>
</head>
<body>
    <div id="plot"></div>
    <script>
        const plotDiv = document.getElementById('plot');
        const data = JSON.parse('[{"imag":[1],"marker":{"color":"pink","size":30.0,"symbol":"x"},"real":[1],"subplot":"smith1","type":"scattersmith"},{"imag":[1],"marker":{"color":"green","size":30.0,"symbol":"x"},"real":[1],"subplot":"smith2","type":"scattersmith"}]');
        const layout = JSON.parse('{"smith":{"bgcolor":"lightgrey","domain":{"x":[0.0,0.45]},"imaginaryaxis":{"gridcolor":"blue"},"realaxis":{"gridcolor":"red"}},"smith2":{"bgcolor":"lightgrey","domain":{"x":[0.55,1.0]},"imaginaryaxis":{"gridcolor":"red"},"realaxis":{"gridcolor":"blue"}}}');
        let resizing = false;
        function applyResize() {
            plotDiv.style.width = window.innerWidth + 'px';
            plotDiv.style.height = window.innerHeight + 'px';
            Plotly.newPlot(plotDiv, data, layout);
            resizing = false;
        }
        plotDiv.style.width = window.innerWidth + 'px';
        plotDiv.style.height = window.innerHeight + 'px';
        Plotly.newPlot(plotDiv, data, layout);
        window.addEventListener('resize', () => {
            if (!resizing) {
                resizing = true;
                window.requestAnimationFrame(applyResize);
            }
        });
    </script>
</body>
</html>
