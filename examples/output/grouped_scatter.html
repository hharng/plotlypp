<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Plotly++ Plot</title>
    <script src="./js/plotly.min.js"></script>
    <script>
        if (typeof Plotly === 'undefined') {
            document.write('<script src="./plotly.min.js"><\/script>')
            document.write('<script src="https://cdn.plot.ly/plotly-3.0.1.min.js"><\/script>')
        }
    </script>
</head>
<body>
    <div id="plot"></div>
    <script>
        const plotDiv = document.getElementById('plot');
        const data = JSON.parse('[{"mode":"markers","name":"Gold","type":"scatter","x":["South Korea","China","Canada"],"y":[24,10,9]},{"mode":"markers","name":"Silver","type":"scatter","x":["South Korea","China","Canada"],"y":[13,15,12]},{"mode":"markers","name":"Bronze","type":"scatter","x":["South Korea","China","Canada"],"y":[11,8,12]}]');
        const layout = JSON.parse('{"scattermode":"group","title":{"text":"Grouped by Country"},"xaxis":{"title":{"text":"Country"}},"yaxis":{"title":{"text":"Medals"}}}');
        let resizing = false;
        function applyResize() {
            plotDiv.style.width = window.innerWidth + 'px';
            plotDiv.style.height = window.innerHeight + 'px';
            Plotly.newPlot(plotDiv, data, layout);
            resizing = false;
        }
        plotDiv.style.width = window.innerWidth + 'px';
        plotDiv.style.height = window.innerHeight + 'px';
        Plotly.newPlot(plotDiv, data, layout);
        window.addEventListener('resize', () => {
            if (!resizing) {
                resizing = true;
                window.requestAnimationFrame(applyResize);
            }
        });
    </script>
</body>
</html>
