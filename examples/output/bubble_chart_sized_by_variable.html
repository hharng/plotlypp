<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Plotly++ Plot</title>
    <script src="./js/plotly.min.js"></script>
    <script>
        if (typeof Plotly === 'undefined') {
            document.write('<script src="./plotly.min.js"><\/script>')
            document.write('<script src="https://cdn.plot.ly/plotly-3.0.1.min.js"><\/script>')
        }
    </script>
</head>
<body>
    <div id="plot"></div>
    <script>
        const plotDiv = document.getElementById('plot');
        const data = JSON.parse('[{"marker":{"color":["rgb(135, 135, 125)","rgb(210, 50, 0)","rgb(50, 90, 255)","rgb(178, 0, 0)","rgb(235, 235, 210)","rgb(235, 205, 130)","rgb(55, 255, 217)","rgb(38, 0, 171)","rgb(255, 255, 255)"],"size":[4879.0,12104.0,12756.0,6792.0,142984.0,120536.0,51118.0,49528.0,2370.0],"sizemode":"diameter","sizeref":750.0},"mode":"markers","text":["Mercury","Venus","Earth","Mars","Jupiter","Saturn","Uranus","Neptune","Pluto"],"type":"scatter3d","x":[57.9,108.2,149.6,227.9,778.6,1433.5,2872.5,4495.1,5906.4],"y":[5427,5243,5514,3933,1326,687,1271,1638,2095],"z":[3.7,8.9,9.8,3.7,23.1,9.0,8.7,11.0,0.7]}]');
        const layout = JSON.parse('{"height":800.0,"scene":{"bgcolor":"rgb(20, 24, 54)","xaxis":{"title":{"font":{"color":"white"},"text":"Distance from Sun"}},"yaxis":{"title":{"font":{"color":"white"},"text":"Density"}},"zaxis":{"title":{"font":{"color":"white"},"text":"Gravity"}}},"title":{"text":"Planets!"},"width":800.0}');
        let resizing = false;
        function applyResize() {
            plotDiv.style.width = window.innerWidth + 'px';
            plotDiv.style.height = window.innerHeight + 'px';
            Plotly.newPlot(plotDiv, data, layout);
            resizing = false;
        }
        plotDiv.style.width = window.innerWidth + 'px';
        plotDiv.style.height = window.innerHeight + 'px';
        Plotly.newPlot(plotDiv, data, layout);
        window.addEventListener('resize', () => {
            if (!resizing) {
                resizing = true;
                window.requestAnimationFrame(applyResize);
            }
        });
    </script>
</body>
</html>
